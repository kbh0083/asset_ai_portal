[project]
name = "samsung-ai-portal"
version = "0.1.0"
description = "Samsung AI Portal - 엔터프라이즈 AI 서비스 플랫폼"
requires-python = ">=3.12"
dependencies = [
    # === Core Framework ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # === Database (Async) ===
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",                    # PostgreSQL 비동기 드라이버
    "alembic>=1.14.0",                    # DB 마이그레이션
    
    # === Cache (Async) ===
    "redis[hiredis]>=5.2.0",              # Redis 비동기 지원 + hiredis 파서
    
    # === LLM & AI (vLLM 서빙 기반) ===
    "langchain>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",            
    "langgraph>=1.0.0",
    
    # === Crawling (Async) ===
    "playwright>=1.49.0",
    "crawl4ai>=0.4.0",
    
    # === HTTP Client (Async) ===
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",                   # 비동기 파일 I/O
    
    # === Authentication ===
    "python3-saml>=1.16.0",               # SAML 2.0
    "itsdangerous>=2.2.0",                # 쿠키 서명
    "cryptography>=44.0.0",               # 암호화
    
    # === Logging & Monitoring ===
    "structlog>=24.4.0",                  # 구조화된 로깅
    "python-json-logger>=2.0.0",
    
    # === Utilities ===
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",           # Form 데이터 처리
    "orjson>=3.10.0",                     # 빠른 JSON 직렬화
    "tenacity>=9.0.0",                    # 재시도 로직
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",                      # 테스트 클라이언트
    "ruff>=0.8.0",                        # Linter & Formatter
    "mypy>=1.13.0",                       # 타입 체킹
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

